appId: sa.almanar.erp
productName: نظام المنار
copyright: © شركة المنار

directories:
  output: release
  buildResources: build

# الملفات المضمّنة في التطبيق (الواجهة المبنية + كود Electron المترجم)
files:
  - electron-dist/**/*
  - frontend/dist/**/*
  - package.json

# الخدمة الخلفية + Prisma تُوضع كموارد خارجية لتُشغّل كعملية Node
extraResources:
  - from: backend/dist
    to: backend/dist
  - from: backend/node_modules
    to: backend/node_modules
    filter:
      - "**/*"
  - from: backend/prisma
    to: backend/prisma
  - from: backend/package.json
    to: backend/package.json
  # قاعدة بيانات مبدئية مُهيّأة (أنشئها قبل البناء عبر prisma migrate + seed)
  - from: backend/data/manar.db
    to: backend/data/manar.db
  # خطوط عربية مُضمَّنة في قوالب HTML للتقارير
  - from: backend/assets
    to: backend/assets
  # عميل OAuth سطح المكتب (Google Drive Deployment Pack v1) — Client ID/Secret الخاصان
  # بتطبيق Google Cloud الموزَّع، وليسا سرًا حقيقيًا لتطبيق سطح مكتب (نموذج Google
  # Installed App الرسمي). المستخدم النهائي لا يُنشئ أو ينسخ هذا الملف أبدًا؛ المطوّر
  # يُنشئه مرة واحدة قبل بناء المثبّت — انسخ
  # electron/resources/gdrive-oauth-client.example.json إلى
  # electron/resources/gdrive-oauth-client.json وامْلأه (غير مُتتبَّع بـ git). راجع
  # electron/resources/README.md.
  - from: electron/resources/gdrive-oauth-client.json
    to: gdrive-oauth-client.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ManarSetup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: نظام المنار
  installerLanguages:
    - ar_SA
